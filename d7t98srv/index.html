<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Daniel Tiefenbrunn — AR Visitenkarte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root{
    --petrol:#0E4C60;
    --petrol-deep:#093545;
    --stone:#B9BCBF;
    --stone-light:#D6D8D9;
    --ink:#0B0B0C;
    --ring:rgba(214,216,217,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Nur html bekommt eine Farbe. Ein Hintergrund auf body würde das Kamerabild
     verdecken — MindAR legt das Video mit negativem z-index dahinter. */
  html{background:var(--ink)}
  html,body{margin:0;height:100%;color:var(--stone-light);
    font-family:"Archivo",system-ui,sans-serif;overscroll-behavior:none}
  body{background:transparent}
  a{color:inherit}

  /* Kamerabild formatfüllend */
  body > video{position:fixed !important;inset:0 !important;
    width:100vw !important;height:100vh !important;object-fit:cover !important}

  /* ---------- AR-Bühne ---------- */
  a-scene{position:fixed;inset:0}

  /* ---------- Overlay ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
      justify-content:space-between;padding:env(safe-area-inset-top) 20px calc(24px + env(safe-area-inset-bottom))}

  .eyebrow{margin-top:22px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--stone);opacity:.85}

  /* Statuszeile: sagt immer, was als Nächstes zu tun ist */
  #status{align-self:flex-start;pointer-events:none;
    background:rgba(9,53,69,.66);backdrop-filter:blur(14px);
    border:1px solid rgba(185,188,191,.22);border-radius:999px;
    padding:9px 16px;font-size:12px;letter-spacing:.06em;
    transition:opacity .4s ease}
  #status.hide{opacity:0}

  /* Signature: die Ringe der Karte als Bedienelemente */
  #dock{display:flex;flex-direction:column;align-items:center;gap:18px;
        opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease}
  #dock.on{opacity:1;transform:none;pointer-events:auto}

  #identity{text-align:center;line-height:1.35}
  #identity .name{font-family:"Bodoni Moda",serif;font-size:23px;letter-spacing:.04em;color:#fff}

  /* Porträt im Ring — greift die Kreisform der Karte auf */
  .portrait{display:block;border-radius:50%;object-fit:cover;
    border:1px solid var(--ring);background:var(--petrol-deep)}
  #gate-portrait{width:148px;height:148px}
  #dock-portrait{width:56px;height:56px;margin:0 auto 10px}
  .portrait[hidden]{display:none}
  #identity .role{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--stone);margin-top:6px}
  #identity .role sup{font-size:.68em;letter-spacing:.12em;vertical-align:super;margin-left:.12em}

  .row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

  /* Kopfleiste: immer erreichbar, auch wenn die Karte nicht erkannt wird */
  #topbar{display:flex;align-items:center;justify-content:flex-end;
    margin-top:22px;pointer-events:auto}
  .chip{border:1px solid rgba(185,188,191,.28);background:rgba(9,53,69,.66);
    backdrop-filter:blur(14px);border-radius:999px;color:var(--stone-light);
    padding:9px 15px;font-family:"Archivo",sans-serif;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
  .chip:active{border-color:#fff}

  /* Statusanzeige */
  /* Eigene Ebene über allem. Vorher hing das Fenster im Seitenfluss und
     verschob beim Öffnen die Kopfleiste — der Schließen-Tipp ging dann daneben. */
  #diag-layer{position:fixed;inset:0;z-index:30;pointer-events:auto;
    background:rgba(6,20,26,.62);
    display:flex;align-items:center;justify-content:center;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  #diag-layer > div{width:100%;max-width:360px;margin:auto}
  #diag{width:100%;background:rgba(9,53,69,.96);
    border:1px solid rgba(185,188,191,.24);border-radius:16px;padding:14px 16px 12px;
    font-size:10.5px;line-height:1.65;letter-spacing:.01em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #fit{margin-top:10px;background:rgba(9,53,69,.96);
    border:1px solid rgba(185,188,191,.24);border-radius:16px;padding:14px 16px;
    font-family:"Archivo",sans-serif;font-size:11px;color:var(--stone-light)}
  #fit b{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;margin-bottom:10px}
  #fit label{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:10px}
  #fit input{flex:1;accent-color:#7FB2C4}
  #fit output{min-width:52px;text-align:right;
    font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#9FC0CC}
  #fit code{display:block;margin-top:10px;padding:8px 10px;border-radius:8px;
    background:rgba(0,0,0,.3);font-size:9.5px;line-height:1.7;color:#9FC0CC;
    font-family:ui-monospace,Menlo,monospace;white-space:pre}

  #diag-close{display:block;width:100%;margin-top:12px;
    border:1px solid rgba(185,188,191,.3);background:transparent;border-radius:999px;
    color:var(--stone-light);padding:12px;cursor:pointer;
    font-family:"Archivo",sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase}
  #diag-close:active{background:rgba(185,188,191,.14)}
  #diag b{font-weight:600;color:#fff;letter-spacing:.14em;
    text-transform:uppercase;font-size:9px;display:block;margin-bottom:6px}
  #diag .ok{color:#7FD1A6}
  #diag .bad{color:#F0857D}

  .ring{width:74px;height:74px;border-radius:50%;border:1px solid var(--ring);
    background:radial-gradient(120% 120% at 30% 20%,rgba(14,76,96,.92),rgba(9,53,69,.98));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--stone-light);cursor:pointer;
    transition:transform .18s ease,border-color .18s ease}
  .ring:active{transform:scale(.93);border-color:#fff}
  .ring:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .ring svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.2;
    stroke-linecap:round;stroke-linejoin:round}
  .ring span{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}

  .hidden{display:none !important}

  /* Knöpfe, die den Zeilen im Bildtrack folgen */
  .ar-tap{position:fixed;display:none;z-index:6;padding:0;
    border:0;border-radius:12px;background:transparent;cursor:pointer;
    -webkit-appearance:none;transition:background .12s ease}
  .ar-tap.on{display:block}
  .ar-tap:active{background:rgba(14,76,96,.22)}

  /* ---------- Kartenansicht ohne Kamera ---------- */
  #ui.flat{justify-content:center}
  #ui.flat #lower{display:flex;flex-direction:column;align-items:center;
    padding-top:34px}
  #ui.flat #status{display:none}

  #flat{pointer-events:auto;display:flex;flex-direction:column;align-items:center;
        width:100%;max-width:430px;margin:0 auto 26px}
  #flat-card{width:100%;border-radius:13px;display:block;
    box-shadow:0 26px 64px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.06)}
  #flat-portrait{width:92px;height:92px;border-radius:50%;object-fit:cover;
    border:2px solid var(--petrol);background:#fff;margin-top:-46px;position:relative;z-index:1}
  .flat-name{font-family:"Bodoni Moda",serif;font-size:27px;color:#fff;
    letter-spacing:.03em;margin-top:14px}
  .flat-role{font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--stone);margin-top:7px}
  .flat-role sup{font-size:.68em;letter-spacing:.12em;vertical-align:super;margin-left:.12em}
  /* Der Wechselbereich ist so hoch wie sein größter Inhalt (zwei Kontaktzeilen).
     Damit steht die Ringreihe in beiden Ebenen an derselben Stelle. */
  #flat-swap{width:100%;min-height:132px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;margin-top:16px}
  .flat-claim{font-size:13px;line-height:1.7;color:var(--stone);margin:0;max-width:30ch;
    text-align:center}

  /* Kontaktzeilen — hier tragen sie die Angaben, die sonst im Bildtrack stehen */
  .flat-lines{display:flex;flex-direction:column;gap:9px;width:100%}
  .line{display:block;text-align:center;pointer-events:auto;cursor:pointer;text-decoration:none;
    background:rgba(14,76,96,.5);border:1px solid rgba(185,188,191,.26);border-radius:999px;
    padding:12px 20px;font-size:13.5px;letter-spacing:.02em;color:#fff}
  .line:active{border-color:#fff;background:rgba(14,76,96,.85)}

  /* Startkarte: erscheint vor Kamerastart und als Fallback ohne AR */
  #gate{position:fixed;inset:0;z-index:20;background:var(--ink);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:18px;padding:0 30px calc(46px + env(safe-area-inset-bottom));text-align:center}
  /* Porträt füllt den oberen Bildschirm und läuft nach unten in den Hintergrund aus */
  /* Titelzeile eng an den Namen — die .eyebrow-Grundregel setzt sonst 22px oben drauf */
  #gate-eyebrow{margin-top:-10px}
  #gate-portrait{position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:min(115%,560px);height:auto;max-height:74vh;object-fit:cover;object-position:50% 0;
    border:0;border-radius:0;background:none;pointer-events:none;z-index:0}
  #gate > *:not(#gate-portrait){position:relative;z-index:1}
  #gate h1{font-family:"Bodoni Moda",serif;font-weight:400;font-size:34px;margin:0;color:#fff;letter-spacing:.02em}
  #gate p{max-width:30ch;font-size:13px;line-height:1.7;color:var(--stone);margin:0}
  .cta{pointer-events:auto;border:1px solid var(--ring);background:transparent;color:#fff;
    border-radius:999px;padding:15px 30px;font-family:"Archivo",sans-serif;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;cursor:pointer}
  .cta:active{background:rgba(185,188,191,.12)}
  .ghost{border:0;color:var(--stone);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    background:none;cursor:pointer;pointer-events:auto;text-decoration:underline;text-underline-offset:5px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<!-- =========================================================
     1) KONFIGURATION — nur dieser Block muss angepasst werden
     ========================================================= -->
<script>
const CONFIG = {
  firstName : "Daniel",
  lastName  : "Tiefenbrunn",
  role      : "Ing. a Dipl. BW",             // Haupttitel
  roleSuper : "WU",                          // wird hochgestellt dargestellt
  company   : "",                            // bewusst leer — kein Firmenname
  claim     : "It's all about Business Creativity",

  phone        : "+4369917136969",           // E.164, wird so gewählt
  phoneDisplay : "+43 699 171 36 969",       // so wird es angezeigt
  email        : "d.tiefenbrunn@gmx.net",
  linkedin     : "https://www.linkedin.com/in/daniel-tiefenbrunn-3b9b06198",

  street    : "",                            // optional
  city      : "",
  zip       : "",
  country   : "Österreich",

  // Porträt: Datei neben index.html legen. Leer lassen = ohne Foto.
  // Empfehlung: quadratisch, ca. 600 × 600 px, unter 150 KB.
  photo      : "./foto.jpg",        // quadratisch — Kontaktdatei und AR-Panel
  photoStart : "./foto-start.webp",
  // Kartenabbildung in der Ansicht ohne Kamera, je Ebene ein eigenes Motiv
  cardFlat1  : "./flat-1.jpg",   // Übersicht
  cardFlat2  : "./flat-2.jpg",   // Kontaktdaten

  // Pfad zur kompilierten Bildmarke (siehe ANLEITUNG.md, Schritt 1)
  targetSrc : "./target.mind",

  // ----- Ruhe des Bildes auf der Karte -----
  // Entscheidend ist filterBeta, nicht filterMinCF. Beta bestimmt, ab welcher
  // Bewegung die Glättung nachlässt. MindAR liefert 1000 aus — so hoch, dass
  // schon das Messrauschen als Bewegung gilt und gar nicht geglättet wird.
  // Gemessen (Zittern / Nachlauf bei schneller Bewegung, in ‰ der Kartenbreite):
  //   beta 1000 → 8.3 / 5      Auslieferungszustand, sichtbares Zittern
  //   beta   50 → 4.5 / 11
  //   beta   15 → 2.4 / 28     hier eingestellt
  //   beta    5 → 1.0 / 56     noch ruhiger, sichtbarer Nachlauf
  filterMinCF : 0.001,
  filterBeta  : 15,
  warmup      : 1,    // Bilder, die stimmen müssen, bevor eingeblendet wird
  miss        : 20,   // Bilder ohne Fund, bevor MindAR die Marke aufgibt

  // ----- Deckung des Overlays auf der Karte -----
  // 1.0 = so groß wie die kompilierte Bildmarke. Deckt das Overlay die Karte
  // nicht ganz, Wert erhöhen; ragt es über, verringern.
  // Mit ?diag in der Adresse erscheint ein Regler zum Justieren.
  cardScale : 1.065,
  cardShiftX: -0.010,  // seitlich verschieben, in Kartenbreiten
  cardShiftY: -0.048,

  // ----- Kamera -----
  // Höhere Auflösung liefert der Bilderkennung mehr Merkmalspunkte und damit
  // ruhigeres Tracking. 1280×720 ist ein guter Kompromiss; 1920×1080 ist
  // schärfer, kostet aber spürbar Rechenzeit auf älteren Geräten.
  camWidth  : 1280,
  camHeight : 720
};
</script>

<script>
// Übernimmt die Lage von #target, geglättet auf Bildwiederholrate.
// Totband gegen Restflimmern im Stillstand, kurze Zeitkonstante bei Bewegung.
AFRAME.registerComponent('smoothed-anchor', {
  schema: {
    src:       { type: 'selector' },
    src2:      { type: 'selector' },   // zweite Bildmarke, optional
    tauRest:   { default: 0.10  },   // Sekunden — Glättung im Stillstand
    tauMove:   { default: 0.002 },   // Sekunden — Glättung während Bewegung
    // Totband: Messrauschen unterhalb dieser Schwelle wird ignoriert.
    // 3 ‰ der Kartenbreite sind 0,27 mm — auf dem Bildschirm gut ein Pixel.
    dead:      { default: 0.006  },  // Totband in Kartenbreiten (0,53 mm)
    deadAng:   { default: 0.008  },  // Totband für Drehung, Bogenmaß (0,46°)
    // Ab welcher Geschwindigkeit die Glättung nachlässt. Klein = folgt auch
    // langsamen Bewegungen sofort.
    speedRef:  { default: 0.08  },
    // Obergrenze für plausible Bewegung. 25 Kartenbreiten/s sind rund 2 m/s —
    // schneller bewegt niemand eine Karte vor der Kamera. Echte Fehlmessungen
    // springen um ein Vielfaches weiter und werden weiterhin abgefangen.
    // Gemessener Nachlauf bei 5 Kartenbreiten/s: bei 2.5 waren es 30 mm, jetzt 0.
    maxSpeed:  { default: 25    },   // zulässige Änderung der Geschwindigkeit
    maxErr:    { default: 0.30  },   // Grundtoleranz in Kartenbreiten (27 mm)
    maxSpin:   { default: 25    },   // Bogenmaß pro Sekunde
    outlierMax:{ default: 2     },   // so viele Ausreißer, dann ist es echt
    // MindAR misst mit rund 30 Hz, gezeichnet wird mit 60. Jedes zweite Bild
    // bekäme also denselben Wert — eine sichtbare Treppe. Zwischen zwei
    // Messungen wird deshalb mit der zuletzt gemessenen Geschwindigkeit
    // weitergerechnet, höchstens aber diese Zeitspanne lang.
    // Bei 30 Hz Messung und 60 Hz Darstellung genügt gut ein Bild Vorlauf.
    // Mehr würde beim abrupten Anhalten sichtbar überschwingen: gemessen
    // 6,2 mm bei 55 ms, 2,0 mm bei 20 ms.
    predictMax:{ default: 0.020 },   // Sekunden
    coastMax:  { default: 0.35  },   // so lange nach Kartenverlust weiterlaufen
    // Die Geschwindigkeit wird über mehrere Messungen gemittelt. Ungeglättet
    // wäre sie fast nur Messrauschen — und die Vorausberechnung würde dieses
    // Rauschen verstärken statt die Bewegung zu glätten.
    velSmooth: { default: 0.50  },   // Anteil der neuen Messung
    velMin:    { default: 0.30  },   // darunter gilt es als Stillstand
    // Alle Distanzschwellen gelten für diesen Kameraabstand (in Kartenbreiten)
    // und werden sonst proportional mitskaliert. Ein Pixel Messfehler im Bild
    // entspricht bei doppelter Entfernung doppelter Weltdistanz — feste
    // Schwellen wären nah zu weit und fern zu eng.
    refDist:   { default: 2.0   }
  },
  init() {
    const T = THREE;
    this.p = new T.Vector3(); this.q = new T.Quaternion(); this.s = new T.Vector3(1,1,1);
    this.rp = new T.Vector3(); this.rq = new T.Quaternion(); this.rs = new T.Vector3(1,1,1);
    this.pp = new T.Vector3();
    this.lastRaw = new T.Vector3();     // letzte echte Messung
    this.vel     = new T.Vector3();     // geschätzte Geschwindigkeit
    this.target  = new T.Vector3();     // Ziel inklusive Vorausberechnung
    this.sinceMeasure = 0;              // Zeit seit der letzten echten Messung
    this.coast = 0;                     // Zeit ohne Marke im Bild
    this.started = false;
    this.outliers = 0;
    this.activeSrc = null;
    // Kennzahlen für die Statusanzeige
    this.stats = { abstand: 0, verworfen: 0, aussetzer: 0, messungen: 0, bilder: 0 };
    this.el.object3D.matrixAutoUpdate = false;
  },
  tick(time, delta) {
    // Die gerade erkannte Marke gewinnt. Wechselt sie, wird neu eingerastet,
    // damit die Grafik nicht von der einen zur anderen Lage hinübergleitet.
    const a = this.data.src, b = this.data.src2;
    let src = null;
    if (a && a.object3D && a.object3D.visible) src = a;
    else if (b && b.object3D && b.object3D.visible) src = b;

    const o = this.el.object3D;

    const dtAll = Math.min((delta || 16.7) / 1000, 0.1);

    if (!src) {
      // Kurze Aussetzer überbrücken: mit der zuletzt gemessenen Geschwindigkeit
      // weiterlaufen, statt die Grafik sofort verschwinden zu lassen.
      if (o.visible && this.started && this.coast < this.data.coastMax) {
        if (this.coast === 0) this.stats.aussetzer++;
        this.coast += dtAll;
        this.p.x += this.vel.x * dtAll;
        this.p.y += this.vel.y * dtAll;
        this.p.z += this.vel.z * dtAll;
        o.matrix.compose(this.p, this.q, this.s);
        o.matrixWorldNeedsUpdate = true;
        return;
      }
      if (o.visible) { o.visible = false; this.started = false; this.outliers = 0; }
      this.activeSrc = null;
      this.coast = 0;
      return;
    }
    this.coast = 0;
    if (src !== this.activeSrc) { this.activeSrc = src; this.started = false; this.outliers = 0; }

    const so = src.object3D;

    so.updateMatrixWorld(true);
    so.matrixWorld.decompose(this.rp, this.rq, this.rs);

    if (!this.started) {                       // erster Fund: ohne Übergang setzen
      this.p.copy(this.rp); this.q.copy(this.rq); this.s.copy(this.rs);
      this.pp.copy(this.rp); this.lastRaw.copy(this.rp);
      this.vel.set(0, 0, 0); this.sinceMeasure = 0;
      this.started = true; o.visible = true;
    } else {
      const dt = dtAll;

      // Liegt eine neue Messung vor? Sonst zwischen zwei Messungen weiterrechnen.
      // Die Zeit seit der letzten echten Messung wird bei jedem Bild
      // mitgezählt — unabhängig davon, ob gerade vorausgerechnet wird.
      // Vorher hing sie an der Vorausberechnung; dadurch war die Spanne oft
      // nur ein Bild statt zwei, jede Bewegung erschien doppelt so schnell,
      // und die Verfolgung brach schon bei 116 cm/s ab statt bei den
      // eingestellten 25 Kartenbreiten pro Sekunde.
      this.sinceMeasure += dt;

      // Maßstab aus der aktuellen Kameraentfernung
      const abstand = Math.hypot(this.rp.x, this.rp.y, this.rp.z);
      const skala   = Math.max(0.3, abstand / this.data.refDist);
      this.stats.abstand = abstand;
      this.stats.bilder++;

      const neu = this.lastRaw.distanceTo(this.rp) > 1e-7;

      if (neu) {
        const span = Math.max(this.sinceMeasure, 1 / 120);

        // Plausibel ist, was zur bisherigen Bewegung passt — nicht, was langsam
        // ist. Über die Geschwindigkeit allein ließen sich die Fälle nicht
        // trennen: Ein Fehlmesswert aus der Ruhe springt mit 27 Kartenbreiten
        // pro Sekunde, ein schneller Schwenk erreicht 20. Verglichen wird
        // deshalb mit der aus der bisherigen Bewegung erwarteten Lage.
        // Beim Schwenken trifft die Erwartung, der Fehler bleibt klein.
        // Ein Sprung aus der Ruhe weicht stark ab und wird verworfen.
        const erwX = this.lastRaw.x + this.vel.x * span;
        const erwY = this.lastRaw.y + this.vel.y * span;
        const erwZ = this.lastRaw.z + this.vel.z * span;
        const fehler = Math.hypot(this.rp.x - erwX, this.rp.y - erwY, this.rp.z - erwZ);
        // Erlaubt ist eine Grundtoleranz plus das, was die Karte bei ihrem
        // bisherigen Tempo in dieser Zeit zurücklegen konnte. Im Stillstand
        // ist die Schwelle eng, beim Schwenken weit.
        const tempoAlt = Math.hypot(this.vel.x, this.vel.y, this.vel.z);
        const erlaubt  = this.data.maxErr * skala + tempoAlt * span;

        if (fehler > erlaubt && this.outliers < this.data.outlierMax) {
          this.outliers++;
          this.stats.verworfen++;
          o.matrix.compose(this.p, this.q, this.s);
          o.matrixWorldNeedsUpdate = true;
          o.visible = true;
          return;                       // sinceMeasure läuft weiter
        }
        this.outliers = 0;

        const k = this.data.velSmooth;
        this.vel.set(this.vel.x + ((this.rp.x - this.lastRaw.x) / span - this.vel.x) * k,
                     this.vel.y + ((this.rp.y - this.lastRaw.y) / span - this.vel.y) * k,
                     this.vel.z + ((this.rp.z - this.lastRaw.z) / span - this.vel.z) * k);
        this.lastRaw.copy(this.rp);
        this.sinceMeasure = 0;
        this.target.copy(this.rp);
        this.stats.messungen++;
      } else {
        // Zwischen zwei Messungen weiterrechnen — aber nur bei echter Bewegung.
        // Im Stillstand liegt die geschätzte Geschwindigkeit unter der Schwelle,
        // und die Grafik bleibt exakt stehen statt auf dem Rauschen zu zappeln.
        const tempo = Math.hypot(this.vel.x, this.vel.y, this.vel.z);
        if (tempo >= this.data.velMin * skala) {
          const vor = Math.min(this.sinceMeasure, this.data.predictMax);
          this.target.set(this.rp.x + this.vel.x * vor,
                          this.rp.y + this.vel.y * vor,
                          this.rp.z + this.vel.z * vor);
        } else {
          this.target.copy(this.rp);
        }
      }

      const moved = this.p.distanceTo(this.target);
      const ang   = this.q.angleTo(this.rq);

      // Weiches Totband statt harter Schwelle.
      // Ein hartes Totband hält die Grafik still, bis das Rauschen die Schwelle
      // überschreitet — dann ruckt sie auf einen Schlag nach. Gemessen: alle
      // zehn Sekunden ein sichtbarer Ruck von 0,2 mm. Hier wird der Abstand
      // stattdessen um das Totband verkürzt: kleine Abweichungen schrumpfen
      // stetig auf null, große bleiben nahezu unverändert. Kein Schwellwert,
      // der überschritten werden kann, also auch kein Nachrucken.
      // Das Totband soll Rauschen im Stillstand schlucken, nicht echte Bewegung
      // bremsen. Es wird deshalb ausgeblendet, sobald die Karte sich bewegt.
      const tempoNow = Math.hypot(this.vel.x, this.vel.y, this.vel.z);
      const ruhe     = Math.exp(-tempoNow / (this.data.velMin * skala));
      const dz    = this.data.dead * skala * ruhe;
      const dzAng = this.data.deadAng * ruhe;   // Winkel ist entfernungsunabhängig

      const wirkt    = moved > 0 ? Math.max(0, moved - dz)    / moved : 0;
      const wirktAng = ang   > 0 ? Math.max(0, ang   - dzAng) / ang   : 0;

      if (wirkt > 0 || wirktAng > 0) {
        const speed = this.pp.distanceTo(this.target) / dt;
        this.pp.copy(this.target);
        const tau = this.data.tauMove +
                    (this.data.tauRest - this.data.tauMove) * Math.exp(-speed / this.data.speedRef);
        const a = 1 - Math.exp(-dt / tau);
        if (wirkt    > 0) this.p.lerp(this.target, a * wirkt);
        if (wirktAng > 0) this.q.slerp(this.rq, a * wirktAng);
        this.s.lerp(this.rs, a);
      }
      o.visible = true;
    }
    o.matrix.compose(this.p, this.q, this.s);
    o.matrixWorldNeedsUpdate = true;
  }
});
</script>

<!-- =========================================================
     2) AR-SZENE
     ========================================================= -->
<a-scene id="scene"
  mindar-image="autoStart: false; uiScanning: no; uiLoading: no; uiError: no"
  renderer="colorManagement: true; antialias: false; precision: mediump;
            maxCanvasWidth: 1280; maxCanvasHeight: 1280"
  light="defaultLightsEnabled: false"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
  embedded>

  <!-- Alle Texturen vorab laden. Ohne das wird die zweite Grafik erst beim
       Umschalten dekodiert und auf die Grafikeinheit geschoben — das ist der
       Ruckler beim Ebenenwechsel. -->
  <a-assets timeout="8000">
    <img id="tex-ov1"   src="./overlay-1.webp">
    <img id="tex-ov2"   src="./overlay-2.webp">
    <img id="tex-pan1"  src="./panel-1.jpg">
    <img id="tex-pan2"  src="./panel-2.jpg">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Zielraum: die Karte ist 1 Einheit breit, 0.5715 hoch (3281:1875).
       Sie reicht also von x -0.5…+0.5 und y -0.286…+0.286.
       Das Panel dockt rechts an die Kartenkante an. -->
  <!-- #target empfängt die rohe Lage von MindAR und bleibt leer.
       Der Inhalt hängt an #anchor, einer eigenen Ebene, die die Lage
       geglättet übernimmt. So kann die Glättung nicht auf sich selbst
       zurückwirken — sie liest immer den frischen Rohwert. -->
  <!-- Zwei Bildmarken: Index 0 und 1 in der kompilierten target.mind.
       Beide bleiben leer und liefern nur die Rohlage. Welche gerade erkannt
       ist, entscheidet die Glättung unten — es zählt immer die sichtbare. -->
  <a-entity id="target"  mindar-image-target="targetIndex: 0"></a-entity>
  <a-entity id="target2" mindar-image-target="targetIndex: 1"></a-entity>

  <a-entity id="anchor" smoothed-anchor="src: #target; src2: #target2" visible="false">

   <!-- Alles Sichtbare hängt an dieser Gruppe. Der Feinabgleich skaliert und
        verschiebt nur sie — Kartengrafik, Panel und Trefferflächen bewegen
        sich dadurch zwingend gemeinsam und behalten ihre Abstände. -->
   <a-entity id="ar-fit">

    <!-- Zwei Überlagerungen, deckungsgleich mit der echten Karte. Sichtbar ist
         immer nur eine — sie wechselt mit der Ebene, die Karte "dreht sich um".
         Weiche Außenkante: ein kleiner Lagefehler zeigt sich als sanfter
         Übergang statt als doppelte Kante. -->
    <a-image id="ar-card-1" src="#tex-ov1" width="1" height="0.5715"
             position="0 0 0.001"
             material="shader: flat; transparent: true"></a-image>
    <a-image id="ar-card-2" src="#tex-ov2" width="1" height="0.5715"
             position="0 0 0.0011" visible="false"
             material="shader: flat; transparent: true"></a-image>

    <!-- Panel sitzt unter der Karte: Karte 1 breit, Panel 1 breit und 0.42 hoch.
         Kartenunterkante liegt bei y -0.28575, Panelmitte damit bei -0.49575.
         Porträt und Text sind ins Bild gebacken — ein Zeichenaufruf pro Szene. -->
    <a-entity id="ar-scene-1">
      <a-image src="#tex-pan1" width="1" height="0.42"
               position="0 -0.49575 0.002" material="shader: flat"></a-image>
    </a-entity>

    <a-entity id="ar-scene-2" visible="false">
      <a-image src="#tex-pan2" width="1" height="0.42"
               position="0 -0.49575 0.002" material="shader: flat"></a-image>

      <!-- Unsichtbare Trefferflächen, deckungsgleich mit den Textzeilen im Panel.
           Sie leuchten beim Antippen kurz auf, damit der Treffer sichtbar wird. -->
      <a-plane class="ar-hit" data-act="call"
               width="0.52" height="0.115" position="0 -0.44895 0.004"
               material="shader: flat; color: #0E4C60; transparent: true; opacity: 0"></a-plane>
      <a-plane class="ar-hit" data-act="mail"
               width="0.46" height="0.110" position="0 -0.57515 0.004"
               material="shader: flat; color: #0E4C60; transparent: true; opacity: 0"></a-plane>
    </a-entity>

   </a-entity>
  </a-entity>
</a-scene>

<!-- =========================================================
     5) LOGIK
     ========================================================= -->
<script>
(function () {
  const $  = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  // Target-Pfad aus CONFIG in die Szene schreiben
  const sceneEl = $('#scene');
  sceneEl.setAttribute('mindar-image', [
    'imageTargetSrc: ' + CONFIG.targetSrc,
    'autoStart: false',
    'uiScanning: no', 'uiLoading: no', 'uiError: no',
    'maxTrack: 1',   // eine Marke gleichzeitig genügt, beide werden gesucht
    'warmupTolerance: ' + CONFIG.warmup,
    'missTolerance: '   + CONFIG.miss,
    'filterMinCF: '     + CONFIG.filterMinCF,
    'filterBeta: '      + CONFIG.filterBeta
  ].join('; '));

  // Texte aus CONFIG befüllen
  const fullName = CONFIG.firstName + ' ' + CONFIG.lastName;
  // Titel in zwei Fassungen: hochgestellt fürs Overlay, flach für 3D-Text und Kontaktdatei
  const roleHTML  = CONFIG.roleSuper
    ? CONFIG.role + '<sup>' + CONFIG.roleSuper + '</sup>' : CONFIG.role;
  const rolePlain = CONFIG.roleSuper
    ? CONFIG.role + ' (' + CONFIG.roleSuper + ')' : CONFIG.role;

  const brandLine = CONFIG.company || rolePlain;
  $('#brand').textContent        = brandLine;
  $('#gate-eyebrow').textContent = brandLine;
  $('#gate-name').textContent    = fullName;
  $('#gate-claim').textContent   = CONFIG.claim;
  $('#identity .name').textContent = fullName;
  $('#identity .role').innerHTML   = roleHTML;
  // ---------- Deckung des Overlays ----------
  // Wirkt auf die ganze Gruppe. Die Kartengrafik sitzt in deren Mittelpunkt,
  // das Panel darunter — beim Skalieren rückt es proportional mit, wie es soll.
  function applyCardFit(scale, dx, dy) {
    const g = $('#ar-fit');
    if (!g) return;
    g.setAttribute('scale', scale + ' ' + scale + ' 1');
    g.setAttribute('position', dx + ' ' + dy + ' 0');
  }
  applyCardFit(CONFIG.cardScale, CONFIG.cardShiftX, CONFIG.cardShiftY);

  $('#flat-card').src        = CONFIG.cardFlat1;
  $('.flat-name').textContent = fullName;
  $('.flat-role').innerHTML   = roleHTML;
  $('#flat-1').textContent    = CONFIG.claim;
  $('#flat-phone').textContent = CONFIG.phoneDisplay || CONFIG.phone;
  $('#flat-mail').textContent  = CONFIG.email;

  // ---------- Porträt ----------
  // Wird beim Seitenstart geladen und als Base64 vorgehalten. Das muss vor dem
  // Antippen passieren: Ein Download nach einem await gilt auf iOS nicht mehr
  // als Nutzeraktion und würde blockiert.
  let photoB64 = null, photoType = 'JPEG';

  function preloadPhoto() {
    if (!CONFIG.photo) return;
    $('#gate-portrait').src = CONFIG.photoStart || CONFIG.photo;
    $('#gate-portrait').hidden = false;
    $('#dock-portrait').src = CONFIG.photo;
    $('#dock-portrait').hidden = false;
    $('#flat-portrait').src = CONFIG.photo;
    $('#gate-portrait').addEventListener('error', e => e.target.hidden = true);
    $('#dock-portrait').addEventListener('error', e => e.target.hidden = true);

    fetch(CONFIG.photo)
      .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(buf => {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        photoB64 = btoa(bin);
        photoType = /\.png$/i.test(CONFIG.photo) ? 'PNG' : 'JPEG';
        renderDiag();
      })
      .catch(() => { photoB64 = null; renderDiag(); });
  }

  // vCard verlangt Zeilen unter 75 Zeichen; Fortsetzungen beginnen mit Leerzeichen.
  function photoLines() {
    if (!photoB64) return [];
    const all = 'PHOTO;ENCODING=b;TYPE=' + photoType + ':' + photoB64;
    const out = [all.slice(0, 75)];
    for (let i = 75; i < all.length; i += 74) out.push(' ' + all.slice(i, i + 74));
    return out;
  }

  // ---------- Aktionen ----------
  const actions = {
    web()  { window.open(CONFIG.linkedin, '_blank', 'noopener'); },

    call() { window.location.href = 'tel:' + CONFIG.phone.replace(/[^\d+]/g, ''); },

    mail() { window.location.href = 'mailto:' + CONFIG.email; },

    vcard() {
      const hasAddress = CONFIG.street || CONFIG.city || CONFIG.zip;
      const v = [
        'BEGIN:VCARD', 'VERSION:3.0',
        'N:' + CONFIG.lastName + ';' + CONFIG.firstName + ';;;',
        'FN:' + fullName,
        CONFIG.company ? 'ORG:' + CONFIG.company : null,
        CONFIG.role    ? 'TITLE:' + rolePlain : null,
        'TEL;TYPE=CELL,VOICE:' + CONFIG.phone,
        'EMAIL;TYPE=INTERNET,HOME:' + CONFIG.email,
        'URL;TYPE=LinkedIn:' + CONFIG.linkedin,
        hasAddress ? 'ADR;TYPE=WORK:;;' + CONFIG.street + ';' + CONFIG.city + ';;' + CONFIG.zip + ';' + CONFIG.country : null,
        'NOTE:' + CONFIG.claim,
        ...photoLines(),
        'END:VCARD'
      ].filter(Boolean).join('\r\n');

      const blob = new Blob([v], { type: 'text/vcard;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = CONFIG.lastName + '_' + CONFIG.firstName + '.vcf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },

    next() { setStep(2); },
    back() { setStep(1); }
  };

  // ---------- Szenenwechsel ----------
  let flatMode = false;   // true = Kartenansicht ohne Kamera
  let currentStep = 1;    // 1 = Übersicht, 2 = Kontakt

  function setStep(n) {
    currentStep = n;
    $('#dock-1').classList.toggle('hidden', n !== 1);
    $('#dock-2').classList.toggle('hidden', n !== 2);
    $('#identity').classList.toggle('hidden', n !== 2 || flatMode);
    $('#flat-1').classList.toggle('hidden', n !== 1);
    $('#flat-2').classList.toggle('hidden', n !== 2);
    const card = $('#flat-card');
    const want = n === 2 ? CONFIG.cardFlat2 : CONFIG.cardFlat1;
    if (card && !card.src.endsWith(want.replace('./', ''))) card.src = want;
    $('#ar-scene-1').setAttribute('visible', n === 1);
    $('#ar-scene-2').setAttribute('visible', n === 2);
    $('#ar-card-1').setAttribute('visible', n === 1);
    $('#ar-card-2').setAttribute('visible', n === 2);
  }

  // ---------- Eventbindung: Overlay + 3D-Objekte ----------
  function bind(el) {
    const act = el.dataset.act || el.getAttribute('data-act');
    if (!act || !actions[act]) return;
    el.addEventListener('click', (e) => { e.preventDefault(); actions[act](); });
  }
  $$('[data-act]').forEach(bind);

  // ---------- Antippbare Zeilen im Bildtrack ----------
  // Statt einen Strahl durch die Szene zu schicken, rechne ich die vier Ecken
  // jeder Fläche in Bildschirmkoordinaten um und lege dort einen echten Knopf
  // hin. Der reagiert auf Berührung so zuverlässig wie jedes andere Bedienelement.
  const taps = $$('.ar-hit').map(plane => {
    const w = parseFloat(plane.getAttribute('width'))  || 0.4;
    const h = parseFloat(plane.getAttribute('height')) || 0.07;
    const btn = document.createElement('button');
    btn.className = 'ar-tap';
    btn.setAttribute('aria-label',
      plane.dataset.act === 'call' ? 'Anrufen' : 'E-Mail schreiben');
    btn.addEventListener('click', e => {
      e.preventDefault();
      plane.setAttribute('material', 'opacity', 0.22);
      setTimeout(() => plane.setAttribute('material', 'opacity', 0), 260);
      actions[plane.dataset.act]();
    });
    document.body.appendChild(btn);
    return { plane, btn, w, h };
  });

  const _v = new THREE.Vector3();

  function followTaps() {
    requestAnimationFrame(followTaps);
    const cam = sceneEl.camera;
    const live = cam && !flatMode && currentStep === 2 && state.target === 'erkannt';
    if (!live) { taps.forEach(t => t.btn.classList.remove('on')); return; }

    const W = window.innerWidth, H = window.innerHeight;
    const rects = [];
    let unbrauchbar = false;
    taps.forEach(({ plane, btn, w, h }) => {
      const o = plane.object3D;
      if (!o) return;
      const hw = w / 2, hh = h / 2;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, behind = false;

      [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].forEach(([x, y]) => {
        _v.set(x, y, 0);
        o.localToWorld(_v);
        _v.project(cam);
        if (_v.z > 1) behind = true;
        const sx = (_v.x * 0.5 + 0.5) * W, sy = (-_v.y * 0.5 + 0.5) * H;
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
        y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      });

      if (behind) { unbrauchbar = true; }
      // Am Bildrand abschneiden statt verwerfen — der sichtbare Teil einer
      // teilweise überstehenden Zeile lässt sich weiterhin antippen.
      rects.push({ btn,
        x0: Math.max(0, x0), y0: Math.max(0, y0),
        x1: Math.min(W, x1), y1: Math.min(H, y1) });
    });

    // Berührungsziele unter 44 px sind zu klein für einen Daumen. Zu kleine
    // Felder wachsen symmetrisch — und wenn sie sich dabei überschneiden,
    // wird die Grenze in die Mitte zwischen beide Felder gelegt.
    const MIN = 44;
    rects.forEach(r => {
      const gy = MIN - (r.y1 - r.y0);
      if (gy > 0) { r.y0 -= gy / 2; r.y1 += gy / 2; }
      const gx = MIN - (r.x1 - r.x0);
      if (gx > 0) { r.x0 -= gx / 2; r.x1 += gx / 2; }
    });
    rects.sort((a, b) => a.y0 - b.y0);
    for (let i = 1; i < rects.length; i++) {
      const a = rects[i - 1], b = rects[i];
      if (a.y1 > b.y0) { const m = (a.y1 + b.y0) / 2; a.y1 = m; b.y0 = m; }
    }

    // Abschließende Prüfung, nachdem Mindestgröße und Überlappung geregelt sind:
    // Entweder alle Zeilen sind sauber bedienbar oder keine. Ein einzelnes
    // antippbares Feld neben einem toten verwirrt mehr, als es nützt — dann
    // übernehmen die Ringe unten, die immer funktionieren.
    // Dieselbe Schwelle wie beim Vergrößern: erscheint ein Feld, ist es auch
    // mindestens daumengroß. Sonst bleibt es aus.
    const MIN_NUTZBAR = MIN;
    if (rects.length !== taps.length) unbrauchbar = true;
    rects.forEach(r => {
      if (r.y1 - r.y0 < MIN_NUTZBAR || r.x1 - r.x0 < MIN_NUTZBAR) unbrauchbar = true;
    });
    // Überschneiden sich zwei Felder noch, träfe ein Tipp womöglich das falsche
    for (let i = 1; i < rects.length; i++) {
      if (rects[i - 1].y1 > rects[i].y0 + 0.5) unbrauchbar = true;
    }
    if (unbrauchbar) { taps.forEach(t => t.btn.classList.remove('on')); return; }

    rects.forEach(({ btn, x0, y0, x1, y1 }) => {
      btn.classList.add('on');
      btn.style.left   = x0 + 'px';
      btn.style.top    = y0 + 'px';
      btn.style.width  = (x1 - x0) + 'px';
      btn.style.height = (y1 - y0) + 'px';
    });
  }
  requestAnimationFrame(followTaps);

  // ---------- Trackingstatus ----------
  const dock = $('#dock'), status = $('#status');
  // Kurze Aussetzer nicht sofort quittieren — sonst flackert die Bedienung weg
  let lostTimer = null;

  // Beide Marken melden denselben Zustand — erkannt ist erkannt.
  let gefunden = 0;
  ['#target', '#target2'].forEach(sel => {
    const el = $(sel);
    if (!el) return;
    el.addEventListener('targetFound', () => {
      gefunden++;
      clearTimeout(lostTimer);
      dock.classList.add('on');
      status.classList.add('hide');
      state.target = 'erkannt'; renderDiag();
    });
    el.addEventListener('targetLost', () => {
      gefunden = Math.max(0, gefunden - 1);
      if (gefunden > 0) return;           // die andere Seite ist noch im Bild
      state.target = 'verloren'; renderDiag();
      clearTimeout(lostTimer);
      lostTimer = setTimeout(() => {
        dock.classList.remove('on');
        status.textContent = 'Karte ins Bild halten';
        status.classList.remove('hide');
      }, 1800);
    });
  });

  // ---------- Statusanzeige ----------
  const state = { target: 'noch nicht gesucht', mind: 'wird geprüft…' };

  // Ist die Bildmarke überhaupt vorhanden? Ohne sie erkennt die Kamera nichts.
  fetch(CONFIG.targetSrc, { method: 'HEAD' })
    .then(r => { state.mind = r.ok ? 'geladen' : 'FEHLT (' + r.status + ')'; })
    .catch(() => { state.mind = 'FEHLT'; })
    .finally(renderDiag);

  // Zeigt, was die Erkennung tatsächlich liefert: Abstand, Messrate,
  // verworfene Fehlmessungen und Aussetzer. Ohne diese Zahlen lässt sich
  // nicht unterscheiden, ob die Glättung bremst oder die Erkennung aussetzt.
  let letzteStats = null, letzteZeit = 0;
  function trackLine() {
    const k = $('#anchor') && $('#anchor').components &&
              $('#anchor').components['smoothed-anchor'];
    if (!k || !k.stats) return 'Erkennung: <span class="bad">keine Daten</span>';
    const s = k.stats, jetzt = performance.now();
    let rate = '–';
    if (letzteStats && jetzt > letzteZeit) {
      const sek = (jetzt - letzteZeit) / 1000;
      rate = ((s.messungen - letzteStats.messungen) / sek).toFixed(0) + '/s';
    }
    letzteStats = { messungen: s.messungen }; letzteZeit = jetzt;
    const gut = s.abstand > 0;
    return 'Abstand: <span class="' + (gut ? 'ok' : 'bad') + '">' +
             s.abstand.toFixed(2) + ' Kartenbreiten</span><br>' +
           'Messrate: <span class="ok">' + rate + '</span><br>' +
           'verworfen: <span class="' + (s.verworfen < 20 ? 'ok' : 'bad') + '">' +
             s.verworfen + '</span>  ·  Aussetzer: <span class="' +
             (s.aussetzer < 10 ? 'ok' : 'bad') + '">' + s.aussetzer + '</span>';
  }

  function renderDiag() {
    const box = $('#diag');
    if ($('#diag-layer').classList.contains('hidden')) return;
    const v = document.querySelector('body > video');
    const line = (label, value, good) =>
      label + ': <span class="' + (good ? 'ok' : 'bad') + '">' + value + '</span>';

    box.innerHTML = '<b>Status</b>' + [
      line('Bildmarke', state.mind, state.mind === 'geladen'),
      line('Kamerabild', v ? (v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'kein Signal')
                          : 'kein Video-Element', !!(v && v.videoWidth)),
      line('Tracking', state.target, state.target === 'erkannt'),
      line('Marken', document.querySelectorAll('[mindar-image-target]').length + ' angelegt', true),
      trackLine(),
      line('Foto', photoB64 ? Math.round(photoB64.length / 1365) + ' KB'
                            : (CONFIG.photo ? 'nicht gefunden' : 'nicht konfiguriert'),
           !!photoB64),
      line('Grafiken', document.querySelectorAll('a-image').length + ' geladen', true),
      line('Tippfelder', document.querySelectorAll('.ar-tap.on').length + ' aktiv',
           document.querySelectorAll('.ar-tap.on').length > 0)
    ].join('<br>');
  }

  // Die Statusanzeige ist ein Werkzeug zur Fehlersuche, nicht Teil der Karte.
  // Sie erscheint nur, wenn ?diag an die Adresse gehängt wird.
  if (/[?&]diag\b/.test(location.search)) $('#btn-diag').classList.remove('hidden');

  function showDiag(on) {
    $('#diag-layer').classList.toggle('hidden', !on);
    clearInterval(diagTimer);
    if (on) { renderDiag(); diagTimer = setInterval(renderDiag, 1000); }
  }
  // Regler mit den aktuellen Werten füllen und live anwenden
  const fitS = $('#fit-s'), fitX = $('#fit-x'), fitY = $('#fit-y');
  fitS.value = CONFIG.cardScale;
  fitX.value = CONFIG.cardShiftX;
  fitY.value = CONFIG.cardShiftY;

  function updateFit() {
    const sc = parseFloat(fitS.value), dx = parseFloat(fitX.value), dy = parseFloat(fitY.value);
    applyCardFit(sc, dx, dy);
    $('#fit-so').textContent = sc.toFixed(3);
    $('#fit-xo').textContent = dx.toFixed(3);
    $('#fit-yo').textContent = dy.toFixed(3);
    $('#fit-code').textContent =
      'cardScale : ' + sc.toFixed(3) + ',\n' +
      'cardShiftX: ' + dx.toFixed(3) + ',\n' +
      'cardShiftY: ' + dy.toFixed(3);
  }
  [fitS, fitX, fitY].forEach(r => r.addEventListener('input', updateFit));
  updateFit();

  let diagTimer = null;
  $('#btn-diag').addEventListener('click', () => showDiag(true));
  $('#diag-close').addEventListener('click', () => showDiag(false));
  // Tippen auf den abgedunkelten Bereich schließt ebenfalls
  $('#diag-layer').addEventListener('click', e => {
    if (e.target === $('#diag-layer')) showDiag(false);
  });

  // Zurück zur Startseite — lädt neu, damit die Kamera sauber neu startet
  $('#btn-home').addEventListener('click', () => location.reload());

  // ---------- Kameraauflösung ----------
  // MindAR fordert die Kamera ohne Auflösungswunsch an — Safari liefert dann
  // 480×640. Bei so wenig Bildinformation findet die Bilderkennung zu wenige
  // Merkmalspunkte, und das Tracking bricht ab. Wir schieben einen Wunsch nach
  // 1280×720 dazwischen, bevor MindAR startet.
  (function raiseCameraResolution() {
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return;
    const original = md.getUserMedia.bind(md);
    md.getUserMedia = (constraints) => {
      if (constraints && constraints.video) {
        const v = (typeof constraints.video === 'object') ? constraints.video : {};
        constraints = Object.assign({}, constraints, {
          video: Object.assign({ facingMode: 'environment' }, v, {
            width:  { ideal: CONFIG.camWidth  },
            height: { ideal: CONFIG.camHeight }
          })
        });
      }
      return original(constraints);
    };
  })();

  // ---------- Start ----------
  $('#btn-start').addEventListener('click', async () => {
    $('#gate').classList.add('hidden');
    try {
      await sceneEl.systems['mindar-image-system'].start();
    } catch (err) {
      status.textContent = 'Kamera nicht verfügbar — Buttons unten funktionieren trotzdem';
      dock.classList.add('on');
    }
  });

  $('#btn-skip').addEventListener('click', () => {
    flatMode = true;
    $('#gate').classList.add('hidden');
    sceneEl.classList.add('hidden');
    $('#ui').classList.add('flat');
    $('#flat').classList.remove('hidden');
    dock.classList.add('on');
    setStep(1);
  });

  preloadPhoto();
  setStep(1);
})();
</script>
</body>
</html>
